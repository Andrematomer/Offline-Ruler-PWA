<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" fill="#FAFAFA" rx="112" />
  
  <!-- Diagonal Ruler Group rotated at -45 deg around center (256, 256) -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Ruler Body -->
    <rect x="-180" y="-45" width="360" height="90" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="10" />
    
    <!-- Large Tick Marks (cm / major units) -->
    <line x1="-150" y1="45" x2="-150" y2="15" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <line x1="-90" y1="45" x2="-90" y2="15" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <line x1="-30" y1="45" x2="-30" y2="15" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <line x1="30" y1="45" x2="30" y2="15" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <line x1="90" y1="45" x2="90" y2="15" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <line x1="150" y1="45" x2="150" y2="15" stroke="#111111" stroke-width="8" stroke-linecap="round" />

    <!-- Medium Ticks (half units) -->
    <line x1="-120" y1="45" x2="-120" y2="25" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <line x1="-60" y1="45" x2="-60" y2="25" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="45" x2="0" y2="25" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="45" x2="60" y2="25" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <line x1="120" y1="45" x2="120" y2="25" stroke="#111111" stroke-width="6" stroke-linecap="round" />

    <!-- Small Ticks (minor subdivisions) -->
    <line x1="-135" y1="45" x2="-135" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="-105" y1="45" x2="-105" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="-75" y1="45" x2="-75" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="-45" y1="45" x2="-45" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="-15" y1="45" x2="-15" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="15" y1="45" x2="15" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="45" y1="45" x2="45" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="75" y1="45" x2="75" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="105" y1="45" x2="105" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="135" y1="45" x2="135" y2="33" stroke="#111111" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>